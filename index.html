<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>QR-Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1c1c22;
    --muted: #767b85;
    --accent: #2b2b33;
    --border: #e2ddd2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 0.88rem;
    margin: 0 0 22px;
  }
  label {
    font-size: 0.8rem;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }
  input[type=text] {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    margin-bottom: 16px;
  }
  input[type=text]:focus { border-color: var(--accent); }

  .row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .row > div { flex: 1; }
  select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.9rem;
    background: white;
  }

  button {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink);
    margin-top: 10px;
  }

  #qrArea {
    display: flex;
    justify-content: center;
    margin: 24px 0 6px;
    min-height: 180px;
    align-items: center;
  }
  #qrArea img, #qrArea canvas, #qrArea table {
    border-radius: 6px;
  }
  .placeholder {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <h1>QR-Code Generator</h1>
  <p class="sub">Text oder Link eingeben, QR-Code wird sofort erzeugt.</p>

  <label for="text">Text oder URL</label>
  <input type="text" id="text" placeholder="https://beispiel.de" value="https://claude.ai">

  <div class="row">
    <div>
      <label for="size">Größe</label>
      <select id="size">
        <option value="180">Klein (180px)</option>
        <option value="260" selected>Mittel (260px)</option>
        <option value="360">Groß (360px)</option>
      </select>
    </div>
    <div>
      <label for="color">Farbe</label>
      <select id="color">
        <option value="#000000" selected>Schwarz</option>
        <option value="#2b2b33">Anthrazit</option>
        <option value="#1c3f5e">Blau</option>
        <option value="#7a1f3d">Bordeaux</option>
      </select>
    </div>
  </div>

  <button id="genBtn">QR-Code erzeugen</button>

  <div id="qrArea"><span class="placeholder">Dein QR-Code erscheint hier</span></div>

  <button id="downloadBtn" class="secondary" style="display:none;">Als PNG herunterladen</button>
</div>

<script>
  let qrInstance = null;
  const qrArea = document.getElementById('qrArea');
  const downloadBtn = document.getElementById('downloadBtn');

  function erzeugen() {
    const text = document.getElementById('text').value.trim();
    const size = parseInt(document.getElementById('size').value, 10);
    const color = document.getElementById('color').value;

    if (!text) {
      qrArea.innerHTML = '<span class="placeholder">Bitte Text oder Link eingeben</span>';
      downloadBtn.style.display = 'none';
      return;
    }

    qrArea.innerHTML = '';
    qrInstance = new QRCode(qrArea, {
      text: text,
      width: size,
      height: size,
      colorDark: color,
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    downloadBtn.style.display = 'block';
  }

  document.getElementById('genBtn').addEventListener('click', erzeugen);
  document.getElementById('text').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') erzeugen();
  });

  downloadBtn.addEventListener('click', () => {
    // qrcodejs erzeugt entweder ein <canvas> oder eine <img>, je nach Browser
    const canvas = qrArea.querySelector('canvas');
    const img = qrArea.querySelector('img');
    const a = document.createElement('a');
    a.download = 'qrcode.png';
    if (canvas) {
      a.href = canvas.toDataURL('image/png');
    } else if (img) {
      a.href = img.src;
    } else {
      return;
    }
    a.click();
  });

  erzeugen();
</script>
</body>
</html>
