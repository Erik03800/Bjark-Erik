<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emoji Foto-Booth</title>
<style>
  :root {
    --ink: #f5f6fa;
    --muted: #9aa1b0;
    --accent: #ff5da2;
    --panel: rgba(20,20,28,0.55);
    --border: rgba(255,255,255,0.14);
    --bg: #0b0b12;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --ink: #1c1c22;
    --muted: #5b5f6b;
    --panel: rgba(255,255,255,0.75);
    --border: rgba(0,0,0,0.1);
    --bg: #eef0f4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app {
    position: relative;
    width: 100%; height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #camWrap {
    position: absolute; inset: 0;
    overflow: hidden;
    background: #000;
  }
  video {
    position: absolute; top: 50%; left: 50%;
    min-width: 100%; min-height: 100%;
    width: auto; height: auto;
    transform: translate(-50%, -50%) scaleX(-1);
    object-fit: cover;
  }
  #stickerLayer {
    position: absolute; inset: 0;
  }
  .sticker {
    position: absolute;
    font-size: 64px;
    line-height: 1;
    cursor: grab;
    touch-action: none;
    user-select: none;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    transform-origin: center;
  }
  .sticker.dragging { cursor: grabbing; }
  .sticker .del {
    position: absolute;
    top: -10px; right: -10px;
    width: 20px; height: 20px;
    background: var(--accent);
    color: white;
    border-radius: 50%;
    font-size: 13px;
    line-height: 20px;
    text-align: center;
    display: none;
  }
  .sticker.selected .del { display: block; }

  #startOverlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 24px;
    background: var(--bg);
    z-index: 20;
  }
  #startOverlay h1 { font-size: 1.4rem; margin: 0; }
  #startOverlay p { color: var(--muted); max-width: 340px; font-size: 0.9rem; line-height: 1.5; margin: 0; }
  #startBtn, .toolbtn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 26px;
    border-radius: 24px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #errorMsg { color: #ff8a8a; font-size: 0.85rem; display: none; }

  #topBar {
    position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 0; right: 0;
    display: flex; justify-content: center; gap: 10px; z-index: 10;
  }
  #snapBtn {
    background: white; color: #111;
    border: none; width: 62px; height: 62px; border-radius: 50%;
    font-size: 1.4rem; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  #bottomBar {
    position: absolute; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0;
    display: flex; justify-content: center; z-index: 10;
  }
  #tray {
    display: flex; gap: 6px; overflow-x: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 8px 10px;
    border-radius: 20px;
    max-width: 92vw;
    backdrop-filter: blur(8px);
  }
  #tray button {
    background: none; border: none; font-size: 1.6rem;
    padding: 4px 6px; cursor: pointer; flex-shrink: 0;
  }
  #hint {
    position: absolute; top: calc(84px + env(safe-area-inset-top, 0px)); left: 0; right: 0;
    text-align: center; color: var(--muted); font-size: 0.78rem; z-index: 5;
    pointer-events: none;
  }
  #flash {
    position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 15;
    transition: opacity 0.12s ease;
  }
  #preview {
    position: absolute; inset: 0; z-index: 30; background: #000;
    display: none; flex-direction: column;
  }
  #preview img { flex: 1; width: 100%; object-fit: contain; }
  #previewBar {
    display: flex; gap: 12px; justify-content: center;
    padding: 14px calc(14px + env(safe-area-inset-bottom, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
    background: rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<div id="app">
  <div id="startOverlay">
    <h1>📸 Emoji Foto-Booth</h1>
    <p>Erlaube Kamerazugriff, klebe Emojis auf dein Gesicht und mach ein Foto. Alles läuft nur in deinem Browser.</p>
    <button id="startBtn">Kamera starten</button>
    <p id="errorMsg">Kamerazugriff wurde verweigert oder ist nicht verfügbar.</p>
  </div>

  <div id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="stickerLayer"></div>
  </div>

  <div id="hint">Emoji tippen zum Hinzufügen · ziehen zum Verschieben · Finger spreizen zum Skalieren</div>

  <div id="topBar">
    <button id="snapBtn">📷</button>
  </div>

  <div id="bottomBar">
    <div id="tray"></div>
  </div>

  <div id="flash"></div>

  <div id="preview">
    <img id="previewImg" alt="Foto">
    <div id="previewBar">
      <button class="toolbtn" id="closePreview">Weiter bearbeiten</button>
      <button class="toolbtn" id="saveBtn" style="background:#2ecc71;">Foto speichern</button>
    </div>
  </div>
</div>

<script>
const EMOJIS = ['😎','🤩','😂','🥳','👑','🐱','🌈','🔥','💀','👽','🎩','🌟','😍','🤪','🍕','❤️'];
const tray = document.getElementById('tray');
EMOJIS.forEach(e => {
  const b = document.createElement('button');
  b.textContent = e;
  b.onclick = () => addSticker(e);
  tray.appendChild(b);
});

const video = document.getElementById('video');
const stickerLayer = document.getElementById('stickerLayer');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const errorMsg = document.getElementById('errorMsg');
const flash = document.getElementById('flash');

let selected = null;

startBtn.addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    startOverlay.style.display = 'none';
  } catch (err) {
    errorMsg.style.display = 'block';
  }
});

function addSticker(emoji) {
  const el = document.createElement('div');
  el.className = 'sticker';
  el.style.left = '50%';
  el.style.top = '45%';
  el.dataset.scale = 1;
  el.dataset.rot = 0;
  el.innerHTML = emoji + '<span class="del">✕</span>';
  makeDraggable(el);
  el.querySelector('.del').addEventListener('click', (ev) => {
    ev.stopPropagation();
    el.remove();
  });
  stickerLayer.appendChild(el);
  selectSticker(el);
}

function selectSticker(el) {
  stickerLayer.querySelectorAll('.sticker').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  selected = el;
}

function applyTransform(el) {
  const scale = el.dataset.scale;
  const rot = el.dataset.rot;
  el.style.transform = `translate(-50%,-50%) scale(${scale}) rotate(${rot}deg)`;
}

function makeDraggable(el) {
  let startX, startY, origLeft, origTop;
  let pointers = {};
  let startDist = 0, startScale = 1, startAngle = 0, startRot = 0;

  el.addEventListener('pointerdown', (e) => {
    selectSticker(el);
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = {x: e.clientX, y: e.clientY};

    if (Object.keys(pointers).length === 1) {
      startX = e.clientX; startY = e.clientY;
      const rect = stickerLayer.getBoundingClientRect();
      origLeft = parseFloat(el.style.left) / 100 * rect.width;
      origTop = parseFloat(el.style.top) / 100 * rect.height;
    }
    if (Object.keys(pointers).length === 2) {
      const pts = Object.values(pointers);
      startDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      startAngle = Math.atan2(pts[0].y - pts[1].y, pts[0].x - pts[1].x);
      startScale = parseFloat(el.dataset.scale);
      startRot = parseFloat(el.dataset.rot);
    }
  });

  el.addEventListener('pointermove', (e) => {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = {x: e.clientX, y: e.clientY};
    const rect = stickerLayer.getBoundingClientRect();

    if (Object.keys(pointers).length === 1) {
      const dx = e.clientX - startX, dy = e.clientY - startY;
      const newLeft = origLeft + dx, newTop = origTop + dy;
      el.style.left = (newLeft / rect.width * 100) + '%';
      el.style.top = (newTop / rect.height * 100) + '%';
    } else if (Object.keys(pointers).length === 2) {
      const pts = Object.values(pointers);
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const angle = Math.atan2(pts[0].y - pts[1].y, pts[0].x - pts[1].x);
      el.dataset.scale = Math.max(0.3, Math.min(5, startScale * (dist / startDist)));
      el.dataset.rot = startRot + (angle - startAngle) * 180 / Math.PI;
      applyTransform(el);
    }
  });

  function endPointer(e) {
    delete pointers[e.pointerId];
    if (Object.keys(pointers).length === 0) el.classList.remove('dragging');
  }
  el.addEventListener('pointerup', endPointer);
  el.addEventListener('pointercancel', endPointer);

  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    el.dataset.scale = Math.max(0.3, Math.min(5, parseFloat(el.dataset.scale) - e.deltaY * 0.001));
    applyTransform(el);
  });

  applyTransform(el);
}

document.getElementById('app').addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.sticker')) {
    stickerLayer.querySelectorAll('.sticker').forEach(s => s.classList.remove('selected'));
    selected = null;
  }
});

// ---------- Foto aufnehmen ----------
const snapBtn = document.getElementById('snapBtn');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const closePreview = document.getElementById('closePreview');
const saveBtn = document.getElementById('saveBtn');
let lastBlob = null;

snapBtn.addEventListener('click', () => {
  flash.style.opacity = '1';
  setTimeout(() => flash.style.opacity = '0', 120);

  const camRect = document.getElementById('camWrap').getBoundingClientRect();
  const canvas = document.createElement('canvas');
  canvas.width = camRect.width;
  canvas.height = camRect.height;
  const ctx = canvas.getContext('2d');

  // Video gespiegelt zeichnen (wie im Preview zu sehen)
  ctx.save();
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(canvas.width / vw, canvas.height / vh);
  const dw = vw * scale, dh = vh * scale;
  ctx.drawImage(video, (canvas.width - dw) / 2, (canvas.height - dh) / 2, dw, dh);
  ctx.restore();

  // Sticker drüberzeichnen
  stickerLayer.querySelectorAll('.sticker').forEach(el => {
    const left = parseFloat(el.style.left) / 100 * canvas.width;
    const top = parseFloat(el.style.top) / 100 * canvas.height;
    const scaleS = parseFloat(el.dataset.scale);
    const rot = parseFloat(el.dataset.rot) * Math.PI / 180;
    const emoji = el.firstChild.textContent;

    ctx.save();
    ctx.translate(left, top);
    ctx.rotate(rot);
    ctx.scale(scaleS, scaleS);
    ctx.font = '64px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, 0, 0);
    ctx.restore();
  });

  canvas.toBlob((blob) => {
    lastBlob = blob;
    previewImg.src = URL.createObjectURL(blob);
    preview.style.display = 'flex';
  }, 'image/png');
});

closePreview.addEventListener('click', () => { preview.style.display = 'none'; });

saveBtn.addEventListener('click', async () => {
  if (!lastBlob) return;
  try {
    const downloads = await claude.use('downloads');
    if (downloads) {
      const buf = await lastBlob.arrayBuffer();
      await downloads.save({ filename: 'emoji-foto.png', data: buf });
      return;
    }
  } catch (e) {}
  // Fallback, falls Download-Capability nicht verfügbar ist
  const a = document.createElement('a');
  a.href = URL.createObjectURL(lastBlob);
  a.download = 'emoji-foto.png';
  a.click();
});
</script>
</body>
</html>
