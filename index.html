<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elbe-Pegel Hamburg – Live</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1e2a45;--txt:#e6edf7;--mute:#8a99b5;--acc:#38bdf8;--hi:#f472b6;--lo:#a3e635}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,sans-serif;padding:20px;max-width:1100px;margin:auto}
  h1{margin:0 0 4px;font-size:22px}
  .sub{color:var(--mute);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:260px 1fr;gap:16px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
  #stations{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
  .st{padding:8px 10px;border-radius:8px;background:#0d1526;border:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .st.on{border-color:var(--acc)}
  .st small{color:var(--mute)}
  .big{font-size:34px;font-weight:700;color:var(--acc)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
  .kpis div{background:#0d1526;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .kpis small{color:var(--mute);display:block}
  canvas{width:100%;height:340px;display:block}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tabs button{background:#26365a;color:var(--txt);border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
  .tabs button.on{background:var(--acc);color:#04202e}
  #msg{color:var(--mute);margin-top:8px}
</style>
</head>
<body>
<h1>🌊 Elbe-Pegel bei Hamburg</h1>
<div class="sub">Live-Wasserstände der Pegel entlang der Elbe – sichtbar sind Ebbe und Flut. Quelle: PEGELONLINE (WSV).</div>
<div class="grid">
  <div class="card"><div id="stations">Lade Pegel …</div></div>
  <div class="card">
    <div id="title" style="font-weight:600;margin-bottom:8px">–</div>
    <div class="kpis">
      <div><small>Aktuell</small><span class="big" id="cur">–</span></div>
      <div><small>Trend</small><b id="trend">–</b></div>
      <div><small>Höchster Wert</small><b id="max">–</b></div>
      <div><small>Niedrigster Wert</small><b id="min">–</b></div>
      <div><small>Tidenhub (Ø)</small><b id="range">–</b></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <canvas id="c"></canvas>
    <div id="msg"></div>
  </div>
</div>

<script>
const API='https://pegelonline.wsv.de/webservices/rest-api/v2';
const $=id=>document.getElementById(id);
let stations=[],sel=null,period='P2D',data=[];

async function loadStations(){
  try{
    const r=await fetch(`${API}/stations.json?waters=ELBE&includeTimeseries=true&includeCurrentMeasurement=true`);
    const all=await r.json();
    stations=all.filter(s=>s.latitude>53.3&&s.latitude<53.95&&s.longitude>8.6&&s.longitude<10.5&&(s.timeseries||[]).some(t=>t.shortname==='W'))
      .sort((a,b)=>a.longitude-b.longitude);
    renderList();
    const start=stations.find(s=>/ST\. PAULI/i.test(s.shortname))||stations[0];
    if(start)select(start.uuid);else $('stations').textContent='Keine Pegel gefunden.';
  }catch(e){$('stations').textContent='Fehler beim Laden: '+e.message;}
}
function renderList(){
  $('stations').innerHTML=stations.map(s=>{
    const w=(s.timeseries.find(t=>t.shortname==='W')||{}).currentMeasurement;
    return `<div class="st ${s.uuid===sel?'on':''}" data-id="${s.uuid}"><span>${s.longname.replace(/\b(\w)(\w*)/g,(m,a,b)=>a+b.toLowerCase())}<br><small>km ${s.km??'–'}</small></span><b>${w?Math.round(w.value)+' cm':'–'}</b></div>`;
  }).join('');
}
$('stations').onclick=e=>{const el=e.target.closest('.st');if(el)select(el.dataset.id);};

const PERIODS=[['P1D','24 h'],['P2D','48 h'],['P7D','7 Tage']];
$('tabs').innerHTML=PERIODS.map(p=>`<button data-p="${p[0]}" class="${p[0]===period?'on':''}">${p[1]}</button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;period=b.dataset.p;
  [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));if(sel)select(sel);};

async function select(id){
  sel=id;renderList();
  const s=stations.find(x=>x.uuid===id);
  $('title').textContent=`${s.longname} · Elbe-km ${s.km??'–'}`;
  $('msg').textContent='Lade Messreihe …';
  try{
    const r=await fetch(`${API}/stations/${id}/W/measurements.json?start=${period}`);
    data=(await r.json()).map(d=>({t:new Date(d.timestamp),v:d.value}));
    stats();draw();$('msg').textContent=`${data.length} Messpunkte, Stand ${data.length?data[data.length-1].t.toLocaleString('de-DE'):'–'}`;
  }catch(e){$('msg').textContent='Fehler: '+e.message;}
}

// Hoch- und Niedrigwasser: lokale Extrema in ±60-Minuten-Fenster (bei 1 Messwert/Min.)
function extrema(){
  const out=[];const w=Math.max(20,Math.round(data.length/(period==='P7D'?200:period==='P2D'?60:30)));
  for(let i=w;i<data.length-w;i++){
    let hi=true,lo=true;
    for(let k=i-w;k<=i+w;k++){if(data[k].v>data[i].v)hi=false;if(data[k].v<data[i].v)lo=false;}
    if((hi||lo)&&(!out.length||i-out[out.length-1].i>w))out.push({i,hi,...data[i]});
  }
  return out;
}
function stats(){
  if(!data.length)return;
  const vs=data.map(d=>d.v),last=data[data.length-1],prev=data[Math.max(0,data.length-15)];
  $('cur').textContent=Math.round(last.v)+' cm';
  const dv=last.v-prev.v;$('trend').textContent=Math.abs(dv)<3?'▬ stabil':dv>0?'▲ steigend':'▼ fallend';
  $('max').textContent=Math.round(Math.max(...vs))+' cm';$('min').textContent=Math.round(Math.min(...vs))+' cm';
  const ex=extrema(),h=ex.filter(e=>e.hi),l=ex.filter(e=>!e.hi);
  $('range').textContent=h.length&&l.length?Math.round(h.reduce((a,b)=>a+b.v,0)/h.length-l.reduce((a,b)=>a+b.v,0)/l.length)+' cm':'–';
}
function draw(){
  const cv=$('c'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);
  if(data.length<2)return;
  const P={l:44,r:12,t:12,b:26},vs=data.map(d=>d.v);
  let mn=Math.min(...vs),mx=Math.max(...vs);const pad=(mx-mn)*.1||10;mn-=pad;mx+=pad;
  const t0=data[0].t,t1=data[data.length-1].t;
  const X=t=>P.l+(t-t0)/(t1-t0)*(W-P.l-P.r),Y=v=>H-P.b-(v-mn)/(mx-mn)*(H-P.t-P.b);
  g.font='11px system-ui';g.fillStyle='#8a99b5';g.strokeStyle='#1e2a45';g.lineWidth=1;
  for(let i=0;i<=5;i++){const v=mn+(mx-mn)*i/5,y=Y(v);g.beginPath();g.moveTo(P.l,y);g.lineTo(W-P.r,y);g.stroke();g.textAlign='right';g.fillText(Math.round(v),P.l-6,y+4);}
  const n=period==='P7D'?7:period==='P2D'?6:6;g.textAlign='center';
  for(let i=0;i<=n;i++){const t=new Date(+t0+(t1-t0)*i/n);g.fillText(period==='P7D'?t.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit'}):t.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),X(t),H-8);}
  const grad=g.createLinearGradient(0,P.t,0,H-P.b);grad.addColorStop(0,'rgba(56,189,248,.35)');grad.addColorStop(1,'rgba(56,189,248,0)');
  g.beginPath();data.forEach((d,i)=>i?g.lineTo(X(d.t),Y(d.v)):g.moveTo(X(d.t),Y(d.v)));
  g.lineTo(X(t1),H-P.b);g.lineTo(X(t0),H-P.b);g.closePath();g.fillStyle=grad;g.fill();
  g.beginPath();data.forEach((d,i)=>i?g.lineTo(X(d.t),Y(d.v)):g.moveTo(X(d.t),Y(d.v)));
  g.strokeStyle='#38bdf8';g.lineWidth=2;g.stroke();
  extrema().forEach(e=>{g.fillStyle=e.hi?'#f472b6':'#a3e635';g.beginPath();g.arc(X(e.t),Y(e.v),4,0,7);g.fill();
    g.fillStyle='#e6edf7';g.textAlign='center';g.fillText((e.hi?'HW ':'NW ')+e.t.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),X(e.t),Y(e.v)+(e.hi?-9:16));});
}
addEventListener('resize',draw);
loadStations();setInterval(()=>{if(sel)select(sel);},300000);
</script>
</body>
</html>
