<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Der Idiotentest</title>
<style>
  :root {
    --bg: #101014;
    --card: #1b1b22;
    --ink: #f2f2f5;
    --muted: #8a8d97;
    --accent: #f2c94c;
    --danger: #ff4d4d;
    --border: #2c2c35;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: opacity 0.5s ease;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .progress {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 22px;
  }
  .question {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 24px;
    line-height: 1.45;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .opt {
    background: #24242e;
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 13px 16px;
    border-radius: 8px;
    font-size: 0.98rem;
    cursor: pointer;
    text-align: left;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .opt:hover { background: #2c2c38; border-color: var(--accent); }

  #closingScreen {
    position: fixed; inset: 0;
    background: #000;
    z-index: 50;
    display: none;
    align-items: center; justify-content: center;
    color: #555;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #startScreen p {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.6;
    margin-bottom: 22px;
  }
  #startBtn {
    background: var(--accent);
    color: #1c1c22;
    border: none;
    padding: 13px 30px;
    border-radius: 24px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  #resultCard .big { font-size: 2rem; margin-bottom: 8px; }
</style>
</head>
<body>

<div id="app">
  <div class="card" id="startScreen">
    <h1>🧠 DER IDIOTENTEST</h1>
    <p>Ein paar knifflige Trickfragen. Aufmerksamkeit ist hier wichtiger als Wissen.<br><br>
    <b style="color:var(--danger)">Achtung:</b> Bei einer falschen Antwort wird die Seite sofort geschlossen.</p>
    <button id="startBtn">Test starten (auf eigene Gefahr)</button>
  </div>
</div>

<div id="closingScreen">Verbindung wird geschlossen …</div>

<script>
const FRAGEN = [
  {
    q: "Wie viele Monate haben 28 Tage?",
    opts: ["Nur der Februar", "Alle 12 Monate", "11 Monate", "6 Monate"],
    korrekt: 1
  },
  {
    q: "Ein Bauer hat 17 Schafe. Alle außer 9 laufen weg. Wie viele Schafe hat er noch?",
    opts: ["8", "17", "9", "0"],
    korrekt: 2
  },
  {
    q: "Was steht in der Mitte von Berlin?",
    opts: ["Der Bahnhof", "Der Buchstabe R", "Der Fernsehturm", "Der Bundestag"],
    korrekt: 1
  },
  {
    q: "Wenn ein Arzt dir 3 Tabletten gibt und sagt, du sollst alle 30 Minuten eine nehmen, wie lange dauert es, bis alle Tabletten genommen sind?",
    opts: ["1,5 Stunden", "90 Minuten", "1 Stunde", "3 Stunden"],
    korrekt: 2
  },
  {
    q: "Wie nennt man Menschen aus Monaco?",
    opts: ["Monacaner", "Monegassen", "Monacoisten", "Monacesen"],
    korrekt: 1
  }
];

let index = 0;
const app = document.getElementById('app');
const closingScreen = document.getElementById('closingScreen');

function render(html) {
  app.style.opacity = '0';
  setTimeout(() => {
    app.innerHTML = html;
    app.style.opacity = '1';
    bindOptions();
  }, 200);
}

function bindOptions() {
  document.querySelectorAll('.opt').forEach((btn, i) => {
    btn.addEventListener('click', () => antworten(i));
  });
  const startBtn = document.getElementById('startBtn');
  if (startBtn) startBtn.addEventListener('click', naechsteFrage);
}

function naechsteFrage() {
  if (index >= FRAGEN.length) {
    zeigeErgebnis();
    return;
  }
  const f = FRAGEN[index];
  render(`
    <div class="card">
      <h1>🧠 IDIOTENTEST</h1>
      <div class="progress">Frage ${index + 1} von ${FRAGEN.length}</div>
      <div class="question">${f.q}</div>
      <div class="options">
        ${f.opts.map(o => `<button class="opt">${o}</button>`).join('')}
      </div>
    </div>
  `);
}

function antworten(gewaehlt) {
  const f = FRAGEN[index];
  if (gewaehlt === f.korrekt) {
    index++;
    naechsteFrage();
  } else {
    schliessen();
  }
}

function schliessen() {
  app.style.opacity = '0';
  setTimeout(() => {
    app.style.display = 'none';
    closingScreen.style.display = 'flex';
    requestAnimationFrame(() => { closingScreen.style.opacity = '1'; });

    // Versuch, den Tab tatsächlich zu schließen (funktioniert nur,
    // wenn der Tab per Skript geöffnet wurde - Browser blockieren
    // das Schließen von normal geöffneten Tabs aus Sicherheitsgründen)
    setTimeout(() => {
      window.close();
    }, 900);
  }, 300);
}

function zeigeErgebnis() {
  render(`
    <div class="card" id="resultCard">
      <div class="big">🏆</div>
      <h1>Bestanden!</h1>
      <p style="color:var(--muted); margin-top:10px;">
        Du hast alle ${FRAGEN.length} Fragen richtig beantwortet. Kein Idiot – zumindest heute nicht.
      </p>
      <button id="startBtn" style="margin-top:20px;">Nochmal von vorn</button>
    </div>
  `);
  index = 0;
  const btn = document.getElementById('startBtn');
  if (btn) btn.onclick = naechsteFrage;
}

document.getElementById('startBtn').addEventListener('click', naechsteFrage);
</script>
</body>
</html>
