<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reaktionstest</title>
<style>
  :root {
    --bg: #05070d;
    --bg2: #0a0e1a;
    --neon: #39ffd6;
    --neon-glow: rgba(57,255,214,0.55);
    --danger: #ff4d6d;
    --warn: #ffcb47;
    --ink: #eef2f7;
    --muted: #6b7688;
    --panel: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.10);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) { }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(circle at 50% 20%, var(--bg2), var(--bg) 70%);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #stars {
    position: fixed; inset: 0; z-index: 0; opacity: 0.5;
  }
  #app {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  h1 {
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    letter-spacing: 3px;
    font-weight: 800;
    margin: 0 0 6px;
    color: var(--neon);
    text-shadow: 0 0 18px var(--neon-glow), 0 0 40px var(--neon-glow);
    text-transform: uppercase;
  }
  .tagline {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 30px;
    max-width: 420px;
  }

  #stage {
    width: min(340px, 82vw);
    height: min(340px, 82vw);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    border: 3px solid var(--border);
    background: var(--panel);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
    box-shadow: 0 0 0 rgba(0,0,0,0);
  }
  #stage:active { transform: scale(0.97); }

  #stage.wait {
    background: radial-gradient(circle, rgba(255,77,109,0.18), transparent 70%);
    border-color: var(--danger);
  }
  #stage.go {
    background: radial-gradient(circle, rgba(57,255,214,0.28), transparent 70%);
    border-color: var(--neon);
    box-shadow: 0 0 60px var(--neon-glow), inset 0 0 40px var(--neon-glow);
  }
  #stage.tooearly {
    background: radial-gradient(circle, rgba(255,77,109,0.35), transparent 70%);
    border-color: var(--danger);
  }
  #stage.idle {
    background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 70%);
  }

  #stageText {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 1px;
  }
  #stageSub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 8px;
    max-width: 220px;
  }
  #bigTime {
    font-size: clamp(2.2rem, 10vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 1px;
  }

  #stats {
    display: flex;
    gap: 28px;
    margin-top: 32px;
  }
  .stat {
    text-align: center;
  }
  .stat .val {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--neon);
  }
  .stat .lbl {
    font-size: 0.72rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  #resetBtn {
    margin-top: 26px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 0.8rem;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  #resetBtn:hover { border-color: var(--neon); color: var(--neon); }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="app">
  <h1>Reaktionstest</h1>
  <p class="tagline">Klicke, wenn der Kreis <b style="color:var(--neon)">grün</b> wird. Zu früh geklickt? Disqualifiziert!</p>

  <div id="stage" class="idle">
    <div id="stageText">Bereit?</div>
    <div id="stageSub">Tippen zum Starten</div>
  </div>

  <div id="stats">
    <div class="stat"><div class="val" id="lastVal">–</div><div class="lbl">Letzte</div></div>
    <div class="stat"><div class="val" id="bestVal">–</div><div class="lbl">Bestzeit</div></div>
    <div class="stat"><div class="val" id="avgVal">–</div><div class="lbl">Ø Schnitt</div></div>
  </div>

  <button id="resetBtn">Statistik zurücksetzen</button>
</div>

<script>
  // ---------- Sternenhintergrund ----------
  const starCanvas = document.getElementById('stars');
  const sctx = starCanvas.getContext('2d');
  function resizeStars() {
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;
  }
  resizeStars();
  window.addEventListener('resize', resizeStars);
  const stars = Array.from({length: 90}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.6 + 0.3,
    s: Math.random() * 0.4 + 0.1,
    a: Math.random()
  }));
  function drawStars() {
    sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
    for (const st of stars) {
      st.a += 0.01 * st.s;
      const alpha = 0.4 + Math.sin(st.a * 6) * 0.4;
      sctx.fillStyle = `rgba(200,220,255,${Math.max(0.05, alpha)})`;
      sctx.beginPath();
      sctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      sctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  drawStars();

  // ---------- Reaktionstest-Logik ----------
  const stage = document.getElementById('stage');
  const stageText = document.getElementById('stageText');
  const stageSub = document.getElementById('stageSub');
  const lastVal = document.getElementById('lastVal');
  const bestVal = document.getElementById('bestVal');
  const avgVal = document.getElementById('avgVal');
  const resetBtn = document.getElementById('resetBtn');

  let state = 'idle'; // idle -> waiting -> go -> result
  let timeoutId = null;
  let startTime = 0;

  function loadStats() {
    try {
      const raw = localStorage.getItem('reaktionstest_stats');
      return raw ? JSON.parse(raw) : {best: null, history: []};
    } catch (e) { return {best: null, history: []}; }
  }
  function saveStats(stats) {
    try { localStorage.setItem('reaktionstest_stats', JSON.stringify(stats)); } catch (e) {}
  }
  function renderStats() {
    const stats = loadStats();
    bestVal.textContent = stats.best ? stats.best + ' ms' : '–';
    if (stats.history.length) {
      const avg = Math.round(stats.history.reduce((a,b) => a+b, 0) / stats.history.length);
      avgVal.textContent = avg + ' ms';
      lastVal.textContent = stats.history[stats.history.length - 1] + ' ms';
    } else {
      avgVal.textContent = '–';
      lastVal.textContent = '–';
    }
  }
  renderStats();

  function setStage(cls, title, sub) {
    stage.className = cls;
    stageText.textContent = title;
    stageSub.textContent = sub || '';
  }

  function begin() {
    setStage('wait', 'Warte...', 'Noch nicht klicken');
    state = 'waiting';
    const delay = 800 + Math.random() * 2200;
    timeoutId = setTimeout(() => {
      startTime = performance.now();
      setStage('go', 'JETZT!', '');
      state = 'go';
    }, delay);
  }

  function tooEarly() {
    clearTimeout(timeoutId);
    setStage('tooearly', 'Zu früh!', 'Tippen für neuen Versuch');
    state = 'idle';
  }

  function result() {
    const reaction = Math.round(performance.now() - startTime);
    const stats = loadStats();
    stats.history.push(reaction);
    if (stats.history.length > 50) stats.history.shift();
    if (!stats.best || reaction < stats.best) stats.best = reaction;
    saveStats(stats);
    renderStats();

    let farbe = 'var(--neon)', urteil = 'Blitzschnell!';
    if (reaction > 350) { farbe = 'var(--danger)'; urteil = 'Geht besser!'; }
    else if (reaction > 220) { farbe = 'var(--warn)'; urteil = 'Solide.'; }

    stage.className = 'idle';
    stageText.innerHTML = `<span id="bigTime" style="color:${farbe}">${reaction} ms</span>`;
    stageSub.textContent = urteil + ' Tippen für nochmal.';
    state = 'idle';
  }

  stage.addEventListener('click', () => {
    if (state === 'idle') begin();
    else if (state === 'waiting') tooEarly();
    else if (state === 'go') result();
  });

  resetBtn.addEventListener('click', () => {
    saveStats({best: null, history: []});
    renderStats();
  });
</script>
</body>
</html>
